<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dofamin — 3D Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05091d;color:#fff;font-family:Arial,sans-serif}#stage{width:100%;height:100%;display:block}.label{position:fixed;left:24px;top:24px;z-index:2;letter-spacing:.12em;font-size:12px;color:#67eee3}.note{position:fixed;left:24px;bottom:24px;z-index:2;color:rgba(255,255,255,.55);font-size:12px}
</style>
</head>
<body>
<div class="label">DOFAMIN · 3D TEST</div>
<div class="note">Three.js · WebGL · тестовая сцена</div>
<canvas id="stage"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
const canvas=document.querySelector('#stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05091d);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,5);
const ambient=new THREE.AmbientLight(0x9ab6ff,1.5);scene.add(ambient);
const key=new THREE.PointLight(0x45f4e5,22,12);key.position.set(2,2,3);scene.add(key);
const rim=new THREE.PointLight(0x754cff,18,10);rim.position.set(-2,-1,2);scene.add(rim);
const geometry=new THREE.SphereGeometry(1,64,64);
const material=new THREE.MeshPhysicalMaterial({color:0x24145f,metalness:.18,roughness:.16,clearcoat:1,clearcoatRoughness:.08,emissive:0x17104a,emissiveIntensity:.45});
const sphere=new THREE.Mesh(geometry,material);scene.add(sphere);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
function animate(t){sphere.rotation.y=t*.00025;sphere.rotation.x=t*.00012;key.position.x=2+Math.sin(t*.001)*.7;renderer.render(scene,camera);requestAnimationFrame(animate)}
requestAnimationFrame(animate);
</script>
</body>
</html>
