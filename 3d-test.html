<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dofamin — 3D Atom Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05091d;color:#fff;font-family:Arial,sans-serif}
#stage{width:100%;height:100%;display:block}
.label{position:fixed;left:24px;top:24px;z-index:2;letter-spacing:.12em;font-size:12px;color:#67eee3}
.note{position:fixed;left:24px;bottom:24px;z-index:2;color:rgba(255,255,255,.55);font-size:12px}
</style>
</head>
<body>
<div class="label">DOFAMIN · 3D ATOM TEST</div>
<div class="note">Three.js · объём · стекло · свет</div>
<canvas id="stage"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';

const canvas=document.querySelector('#stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05091d);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,5.2);

scene.add(new THREE.HemisphereLight(0x8ecfff,0x10051f,1.5));
const key=new THREE.PointLight(0x55fff1,35,12,2);
key.position.set(2.2,2.1,3.2);scene.add(key);
const rim=new THREE.PointLight(0x744dff,28,10,2);
rim.position.set(-2.2,-1.2,2.4);scene.add(rim);
const fill=new THREE.PointLight(0x8bd9ff,12,8,2);
fill.position.set(0,-2,1);scene.add(fill);

const atom=new THREE.Group();
scene.add(atom);

// Основное тело атома: прозрачная физическая поверхность с настоящими бликами.
const coreGeometry=new THREE.SphereGeometry(1,96,96);
const coreMaterial=new THREE.MeshPhysicalMaterial({
  color:0x29d9d0,
  metalness:.05,
  roughness:.09,
  transmission:.28,
  thickness:.75,
  ior:1.45,
  clearcoat:1,
  clearcoatRoughness:.05,
  emissive:0x083f46,
  emissiveIntensity:.7
});
const core=new THREE.Mesh(coreGeometry,coreMaterial);
atom.add(core);

// Мягкое внутреннее свечение — не плоский градиент, а второй объёмный слой.
const innerGeometry=new THREE.SphereGeometry(.78,64,64);
const innerMaterial=new THREE.MeshBasicMaterial({
  color:0x67fff4,
  transparent:true,
  opacity:.16,
  blending:THREE.AdditiveBlending,
  depthWrite:false
});
const inner=new THREE.Mesh(innerGeometry,innerMaterial);
atom.add(inner);

// Тонкая светящаяся оболочка создаёт ощущение стекла/энергии вокруг атома.
const shellGeometry=new THREE.SphereGeometry(1.045,64,64);
const shellMaterial=new THREE.MeshBasicMaterial({
  color:0x5dfff2,
  transparent:true,
  opacity:.08,
  blending:THREE.AdditiveBlending,
  side:THREE.BackSide,
  depthWrite:false
});
const shell=new THREE.Mesh(shellGeometry,shellMaterial);
atom.add(shell);

// Маленький specular-блик, который двигается вместе с источником света.
const highlightGeometry=new THREE.SphereGeometry(.13,32,32);
const highlightMaterial=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.8});
const highlight=new THREE.Mesh(highlightGeometry,highlightMaterial);
highlight.position.set(-.28,.42,.87);
atom.add(highlight);

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

function animate(t){
  const time=t*.001;
  atom.rotation.y=time*.18;
  atom.rotation.x=Math.sin(time*.35)*.08;
  key.position.x=2.2+Math.sin(time*1.1)*.8;
  key.position.y=2.1+Math.cos(time*.8)*.5;
  const pulse=1+Math.sin(time*1.7)*.025;
  inner.scale.setScalar(pulse);
  shell.scale.setScalar(1+Math.sin(time*1.7)*.018);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
