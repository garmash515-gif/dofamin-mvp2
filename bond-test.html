<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dofamin — 3D molecule</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05091d;color:#fff;font-family:Arial,sans-serif}#stage{position:fixed;inset:0;width:100%;height:100%;display:block}.top{position:fixed;top:max(16px,env(safe-area-inset-top));left:20px;right:20px;z-index:5;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-size:18px;font-weight:800}.brand small{display:block;margin-top:3px;font-size:8px;font-weight:400;letter-spacing:.16em;color:#67eee3}.menu{pointer-events:auto;width:42px;height:42px;border:1px solid rgba(103,238,227,.3);border-radius:14px;background:rgba(5,9,29,.35);color:#67eee3;font-size:22px}.intro{position:fixed;z-index:4;left:20px;right:20px;top:86px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.2em;color:#67eee3;margin-bottom:8px}.title{margin:0;max-width:340px;font-size:34px;line-height:.96;letter-spacing:-.045em;font-weight:800}.title em{font-style:normal;color:#67eee3}.sub{max-width:340px;margin:12px 0 0;font-size:13px;line-height:1.48;color:rgba(235,242,255,.6)}.route-label{position:fixed;z-index:4;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;letter-spacing:.12em;color:rgba(235,242,255,.55);white-space:nowrap;pointer-events:none}@media(max-height:700px){.intro{top:70px}.title{font-size:29px}.sub{margin-top:8px;font-size:12px}}@media(min-width:700px){.intro{left:48px;top:100px}.title{font-size:46px}.sub{font-size:14px}}</style></head><body><canvas id="stage"></canvas><header class="top"><div class="brand">DOPAMIN<small>ПУТЬ К ВПЕЧАТЛЕНИЯМ</small></div><button class="menu" aria-label="Меню">☰</button></header><section class="intro"><div class="eyebrow">ДЕЙТИНГ. ВПЕЧАТЛЕНИЕ.</div><h1 class="title">Найди <em>своё</em><br>впечатление</h1><p class="sub">Путь проходит прямо по молекуле. Нажми на светящийся атом.</p></section><div class="route-label" id="routeLabel">01 · НАСТРОЕНИЕ</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
const canvas=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);scene.add(new THREE.HemisphereLight(0x9bd8ff,0x10051f,1.55));const key=new THREE.PointLight(0x55fff1,42,16,2),rim=new THREE.PointLight(0x744dff,30,14,2);scene.add(key,rim);const molecule=new THREE.Group();scene.add(molecule);const atoms=[],routeAtoms=[],routeBonds=[];const names=['НАСТРОЕНИЕ','КОМПАНИЯ','РИСК','ГОРОД','СЮРПРИЗ','ВПЕЧАТЛЕНИЕ'];const colors={C:0x22d8d0,O:0xff6688,N:0x9d73ff,H:0xf2f6ff};
function atom(type,pos,size=.22,routeIndex=null){const g=new THREE.Group();g.position.copy(pos);g.userData={type,routeIndex,scale:1,state:routeIndex===0?'active':'locked'};molecule.add(g);const occluder=new THREE.Mesh(new THREE.SphereGeometry(size*1.015,40,40),new THREE.MeshDepthMaterial());occluder.renderOrder=0;g.add(occluder);const m=new THREE.MeshPhysicalMaterial({color:colors[type],metalness:.05,roughness:.1,transmission:type==='H'?.02:.16,thickness:.55,ior:1.42,clearcoat:1,clearcoatRoughness:.05,emissive:colors[type],emissiveIntensity:type==='H'?.03:(routeIndex===0?.45:.14),transparent:true,opacity:type==='H'?.65:.74,depthWrite:false});const core=new THREE.Mesh(new THREE.SphereGeometry(size,40,40),m);core.renderOrder=2;core.userData.atom=g;g.add(core);const glow=new THREE.Mesh(new THREE.SphereGeometry(size*1.18,28,28),new THREE.MeshBasicMaterial({color:colors[type],transparent:true,opacity:type==='H'?.012:(routeIndex===0?.14:.05),blending:THREE.AdditiveBlending,depthWrite:false}));glow.renderOrder=3;glow.userData.atom=g;g.add(glow);atoms.push(g);if(routeIndex!==null)routeAtoms.push(g);return g}
function bond(a,b,doubleBond=false,routeIndex=null){const d=new THREE.Vector3().subVectors(b,a),len=d.length(),mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5),g=new THREE.Group();g.position.copy(mid);g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());g.userData={routeIndex,baseOpacity:.30,state:routeIndex===0?'active':'idle',length:len};molecule.add(g);const outer=new THREE.Mesh(new THREE.CylinderGeometry(.052,.052,len*.94,20,1,true),new THREE.MeshPhysicalMaterial({color:0x72a9c4,metalness:.16,roughness:.18,transparent:true,opacity:.30,emissive:0x173c5c,emissiveIntensity:.24,depthWrite:false}));outer.renderOrder=-1;outer.userData.bond=g;g.add(outer);if(doubleBond)for(const s of[-1,1]){const x=new THREE.Mesh(new THREE.CylinderGeometry(.016,.016,len*.82,14),new THREE.MeshBasicMaterial({color:0x9df8f2,transparent:true,opacity:.54,blending:THREE.AdditiveBlending,depthWrite:false}));x.position.x=s*.07;x.renderOrder=-1;x.userData.bond=g;g.add(x)}if(routeIndex!==null)routeBonds.push(g);return g}
const R=1.08,ring=[];for(let i=0;i<6;i++){const a=Math.PI/2+i*Math.PI/3;ring.push(new THREE.Vector3(Math.cos(a)*R,Math.sin(a)*R,0))}for(let i=0;i<6;i++)atom('C',ring[i],.20,i);for(let i=0;i<6;i++)bond(ring[i],ring[(i+1)%6],i%2===0,i);
const o1=ring[1].clone().add(new THREE.Vector3(.36,.38,.04)),o2=ring[2].clone().add(new THREE.Vector3(-.36,.38,.04));atom('O',o1,.16);atom('O',o2,.16);bond(ring[1],o1);bond(ring[2],o2);const h1=o1.clone().add(new THREE.Vector3(.16,.23,.03)),h2=o2.clone().add(new THREE.Vector3(-.16,.23,.03));atom('H',h1,.09);atom('H',h2,.09);bond(o1,h1);bond(o2,h2);
const c7=ring[4].clone().add(new THREE.Vector3(.55,-.15,.08)),c8=c7.clone().add(new THREE.Vector3(.72,-.34,.03)),n=c8.clone().add(new THREE.Vector3(.66,-.28,.02));atom('C',c7,.18);atom('C',c8,.17);atom('N',n,.17);bond(ring[4],c7);bond(c7,c8);bond(c8,n);const hs=[c7.clone().add(new THREE.Vector3(.02,.34,.05)),c7.clone().add(new THREE.Vector3(.12,-.25,-.14)),c8.clone().add(new THREE.Vector3(.02,.26,.12)),c8.clone().add(new THREE.Vector3(.14,-.18,-.13)),n.clone().add(new THREE.Vector3(.18,.28,.08)),n.clone().add(new THREE.Vector3(.35,-.05,-.02))];for(let i=0;i<hs.length;i++){atom('H',hs[i],.065);bond(i<2?c7:i<4?c8:n,hs[i])}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let current=0,selected=null,transition=0;
function pointerFromEvent(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1}
function chooseRouteAtom(g){if(g!==routeAtoms[current])return;const old=g;if(selected)selected.userData.state='completed';g.userData.state='selected';selected=g;const next=current<routeAtoms.length-1?current+1:null;if(next!==null){current=next;routeAtoms[next].userData.state='active';routeBonds[current-1].userData.state='pulse';transition=0}document.querySelector('#routeLabel').textContent=`0${g.userData.routeIndex+1} · ${names[g.userData.routeIndex]}`}
canvas.addEventListener('pointerdown',e=>{pointerFromEvent(e);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(routeAtoms.flatMap(g=>g.children.filter(c=>c.userData.atom)),false);if(hits.length)chooseRouteAtom(hits[0].object.userData.atom)});
function fit(){const box=new THREE.Box3().setFromObject(molecule),sphere=box.getBoundingSphere(new THREE.Sphere()),v=THREE.MathUtils.degToRad(camera.fov),h=2*Math.atan(Math.tan(v/2)*camera.aspect),lim=Math.min(v,h),padding=innerWidth<600?.88:.76;camera.position.z=sphere.radius/Math.tan(lim/2)/padding;camera.lookAt(new THREE.Vector3(0,innerWidth<600?-.02:.08,0));molecule.position.y=innerWidth<600?-.08:.02}function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fit()}addEventListener('resize',resize);resize();
function animate(t){const time=t*.001;transition+=.016;key.position.set(2.4+Math.sin(time)*.8,2.5+Math.cos(time*.8)*.5,4);rim.position.set(-2.2,-1.6,3);molecule.rotation.y=Math.sin(time*.20)*.16;molecule.rotation.x=Math.sin(time*.15)*.045;atoms.forEach(g=>{const s=g.userData.state;const target=s==='selected'?1.55:s==='active'?1.16:s==='completed'?1.06:1;g.userData.scale+=(target-g.userData.scale)*.13;g.scale.setScalar(g.userData.scale);const core=g.children.find(c=>c.userData.atom===g),glow=g.children.find(c=>c.userData.atom===g&&c.material?.blending===THREE.AdditiveBlending);const ei=s==='selected'?.95:s==='active'?.5:s==='completed'?.28:(g.userData.type==='H'?.03:.14),go=s==='selected'?.32:s==='active'?.16:s==='completed'?.09:(g.userData.type==='H'?.012:.05);core.material.emissiveIntensity+=(ei-core.material.emissiveIntensity)*.14;glow.material.opacity+=(go-glow.material.opacity)*.14});routeBonds.forEach((g,i)=>{const s=g.userData.state;const active=i===current||s==='pulse';const targetOpacity=active?.76:(i<current?.38:.22);const targetEmissive=active?.8:(i<current?.28:.16);g.children.forEach(c=>{if(!c.material)return;c.material.opacity+=(targetOpacity-c.material.opacity)*.12;if(c.material.emissiveIntensity!==undefined)c.material.emissiveIntensity+=(targetEmissive-c.material.emissiveIntensity)*.12});if(s==='pulse'){const p=(Math.sin(transition*7)+1)/2;g.scale.x=1+.025*p;g.scale.z=1+.025*p;if(transition>1.7)g.userData.state='done'}});renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
