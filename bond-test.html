<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dofamin — 3D molecule</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05091d;color:#fff;font-family:Arial,sans-serif}body{min-height:100dvh}.app{position:relative;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 52%,#102a45 0,#07122b 38%,#05091d 75%)}#stage{position:absolute;inset:0;width:100%;height:100%;display:block}.top{position:absolute;top:max(16px,env(safe-area-inset-top));left:20px;right:20px;z-index:5;display:flex;justify-content:space-between;align-items:center}.brand{font-size:18px;font-weight:800}.brand small{display:block;margin-top:3px;font-size:8px;font-weight:400;letter-spacing:.16em;color:#67eee3}.menu{width:42px;height:42px;border:1px solid rgba(103,238,227,.3);border-radius:14px;background:rgba(5,9,29,.35);color:#67eee3;font-size:22px}.intro{position:absolute;z-index:4;left:20px;right:20px;top:86px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.2em;color:#67eee3;margin-bottom:8px}.title{margin:0;max-width:340px;font-size:34px;line-height:.96;letter-spacing:-.045em;font-weight:800}.title em{font-style:normal;color:#67eee3}.sub{max-width:340px;margin:12px 0 0;font-size:13px;line-height:1.48;color:rgba(235,242,255,.6)}.route-label{position:absolute;z-index:4;left:50%;bottom:24px;transform:translateX(-50%);font-size:10px;letter-spacing:.12em;color:rgba(235,242,255,.55);white-space:nowrap}@media(max-height:700px){.intro{top:70px}.title{font-size:29px}.sub{margin-top:8px;font-size:12px}}@media(min-width:700px){.intro{left:48px;top:100px}.title{font-size:46px}.sub{font-size:14px}}</style></head><body><main class="app"><canvas id="stage"></canvas><header class="top"><div class="brand">DOPAMIN<small>ПУТЬ К ВПЕЧАТЛЕНИЯМ</small></div><button class="menu" aria-label="Меню">☰</button></header><section class="intro"><div class="eyebrow">ДЕЙТИНГ. ВПЕЧАТЛЕНИЕ.</div><h1 class="title">Найди <em>своё</em><br>впечатление</h1><p class="sub">Путь проходит прямо по молекуле. Нажми на активный атом.</p></section><div class="route-label" id="routeLabel">01 · НАСТРОЕНИЕ</div></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
const canvas=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);scene.add(new THREE.HemisphereLight(0x9bd8ff,0x10051f,1.55));const key=new THREE.PointLight(0x55fff1,42,16,2),rim=new THREE.PointLight(0x744dff,30,14,2);scene.add(key,rim);const molecule=new THREE.Group();scene.add(molecule);const atoms=[],routeAtoms=[];const names=['НАСТРОЕНИЕ','КОМПАНИЯ','РИСК','ГОРОД','СЮРПРИЗ','ВПЕЧАТЛЕНИЕ'],colors={C:0x22d8d0,O:0xff6688,N:0x9d73ff,H:0xf2f6ff};
function atom(type,pos,size=.22,routeIndex=null){const g=new THREE.Group();g.position.copy(pos);g.userData={type,routeIndex,baseScale:1,selected:false,route:routeIndex!==null};molecule.add(g);const occluder=new THREE.Mesh(new THREE.SphereGeometry(size*1.01,40,40),new THREE.MeshDepthMaterial());occluder.renderOrder=0;g.add(occluder);const m=new THREE.MeshPhysicalMaterial({color:colors[type],metalness:.05,roughness:.1,transmission:type==='H'?.02:.12,thickness:.5,ior:1.42,clearcoat:1,clearcoatRoughness:.05,emissive:colors[type],emissiveIntensity:type==='H'?.03:.16,transparent:true,opacity:type==='H'?.68:.78,depthWrite:false});const core=new THREE.Mesh(new THREE.SphereGeometry(size,40,40),m);core.renderOrder=2;core.userData.atom=g;g.add(core);const glow=new THREE.Mesh(new THREE.SphereGeometry(size*1.16,28,28),new THREE.MeshBasicMaterial({color:colors[type],transparent:true,opacity:type==='H'?.015:.065,blending:THREE.AdditiveBlending,depthWrite:false}));glow.renderOrder=3;glow.userData.atom=g;g.add(glow);atoms.push(g);if(routeIndex!==null)routeAtoms.push(g);return g}
function bond(a,b,doubleBond=false){const d=new THREE.Vector3().subVectors(b,a),len=d.length(),mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5),g=new THREE.Group();g.position.copy(mid);g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());molecule.add(g);const outer=new THREE.Mesh(new THREE.CylinderGeometry(.052,.052,len*.94,20,1,true),new THREE.MeshPhysicalMaterial({color:0x72a9c4,metalness:.16,roughness:.18,transparent:true,opacity:.30,emissive:0x173c5c,emissiveIntensity:.24,depthWrite:false}));outer.renderOrder=-1;g.add(outer);if(doubleBond)for(const s of[-1,1]){const x=new THREE.Mesh(new THREE.CylinderGeometry(.016,.016,len*.82,14),new THREE.MeshBasicMaterial({color:0x9df8f2,transparent:true,opacity:.54,blending:THREE.AdditiveBlending,depthWrite:false}));x.position.x=s*.07;x.renderOrder=-1;g.add(x)}}
const R=1.08,ring=[];for(let i=0;i<6;i++){const a=Math.PI/2+i*Math.PI/3;ring.push(new THREE.Vector3(Math.cos(a)*R,Math.sin(a)*R,0))}for(let i=0;i<6;i++)atom('C',ring[i],.20,i);for(let i=0;i<6;i++)bond(ring[i],ring[(i+1)%6],i%2===0);
const o1=ring[1].clone().add(new THREE.Vector3(.36,.38,.04)),o2=ring[2].clone().add(new THREE.Vector3(-.36,.38,.04));atom('O',o1,.16);atom('O',o2,.16);bond(ring[1],o1);bond(ring[2],o2);const h1=o1.clone().add(new THREE.Vector3(.16,.23,.03)),h2=o2.clone().add(new THREE.Vector3(-.16,.23,.03));atom('H',h1,.09);atom('H',h2,.09);bond(o1,h1);bond(o2,h2);
const c7=ring[4].clone().add(new THREE.Vector3(.55,-.15,.08)),c8=c7.clone().add(new THREE.Vector3(.72,-.34,.03)),n=c8.clone().add(new THREE.Vector3(.66,-.28,.02));atom('C',c7,.18);atom('C',c8,.17);atom('N',n,.17);bond(ring[4],c7);bond(c7,c8);bond(c8,n);const hs=[c7.clone().add(new THREE.Vector3(.02,.34,.05)),c7.clone().add(new THREE.Vector3(.12,-.25,-.14)),c8.clone().add(new THREE.Vector3(.02,.26,.12)),c8.clone().add(new THREE.Vector3(.14,-.18,-.13)),n.clone().add(new THREE.Vector3(.18,.28,.08)),n.clone().add(new THREE.Vector3(.35,-.05,-.02))];for(let i=0;i<hs.length;i++){atom('H',hs[i],.065);bond(i<2?c7:i<4?c8:n,hs[i])}
for(const r of[1.48,1.78,2.08]){const orb=new THREE.Mesh(new THREE.TorusGeometry(r,.006,8,96),new THREE.MeshBasicMaterial({color:0x4bded8,transparent:true,opacity:.08,blending:THREE.AdditiveBlending,depthWrite:false}));orb.rotation.x=.04;scene.add(orb)}
let current=0,selected=null;const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();function setPointer(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1}
function choose(g){if(g!==routeAtoms[current])return;if(selected)selected.userData.selected=false;selected=g;g.userData.selected=true;document.querySelector('#routeLabel').textContent=`0${current+1} · ${names[current]}`;if(current<routeAtoms.length-1){current++;routeAtoms[current].userData.ready=true}}
canvas.addEventListener('pointerdown',e=>{setPointer(e);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(routeAtoms.flatMap(g=>g.children.filter(c=>c.userData.atom)),false);if(hits.length)choose(hits[0].object.userData.atom)});
function fit(){const box=new THREE.Box3().setFromObject(molecule),sphere=box.getBoundingSphere(new THREE.Sphere()),v=THREE.MathUtils.degToRad(camera.fov),h=2*Math.atan(Math.tan(v/2)*camera.aspect),lim=Math.min(v,h),padding=innerWidth<600?.88:.76;camera.position.z=sphere.radius/Math.tan(lim/2)/padding;camera.lookAt(new THREE.Vector3(0,innerWidth<600?-.02:.08,0));molecule.position.y=innerWidth<600?-.08:.02}function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fit()}addEventListener('resize',resize);resize();
function animate(t){const time=t*.001;key.position.set(2.4+Math.sin(time)*.8,2.5+Math.cos(time*.8)*.5,4);rim.position.set(-2.2,-1.6,3);molecule.rotation.y=Math.sin(time*.20)*.16;molecule.rotation.x=Math.sin(time*.15)*.045;atoms.forEach(g=>{const active=g.userData.selected||g===routeAtoms[current];const target=g.userData.selected?1.48:(active?1.12:1);g.userData.baseScale+=(target-g.userData.baseScale)*.1;g.scale.setScalar(g.userData.baseScale);const core=g.children.find(c=>c.userData.atom===g),glow=g.children.find(c=>c.userData.atom===g&&c.material?.blending===THREE.AdditiveBlending);if(core?.material?.emissiveIntensity!==undefined)core.material.emissiveIntensity+=(g.userData.selected?.85:(active?.4:.16)-core.material.emissiveIntensity)*.1;if(glow)glow.material.opacity+=(g.userData.selected?.26:(active?.14:(g.userData.type==='H'?.015:.065))-glow.material.opacity)*.1});renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
