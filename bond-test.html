<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dofamin — 3D Benzene Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05091d;color:#fff;font-family:Arial,sans-serif}#stage{width:100%;height:100%;display:block}.label{position:fixed;left:24px;top:24px;z-index:2;letter-spacing:.12em;font-size:12px;color:#67eee3}.note{position:fixed;left:24px;bottom:24px;z-index:2;color:rgba(255,255,255,.55);font-size:12px}</style></head><body><div class="label">DOFAMIN · BENZENE TEST</div><div class="note">шесть объёмных атомов · бензольное кольцо · светящиеся связи</div><canvas id="stage"></canvas><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
const canvas=document.querySelector('#stage');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05091d);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,0,7.2);scene.add(new THREE.HemisphereLight(0x9bd8ff,0x10051f,1.6));const key=new THREE.PointLight(0x55fff1,42,16,2);key.position.set(2.8,2.8,4);scene.add(key);const rim=new THREE.PointLight(0x744dff,32,14,2);rim.position.set(-2.5,-1.8,3);scene.add(rim);scene.add(new THREE.PointLight(0x9bd9ff,12,10,2));
const molecule=new THREE.Group();scene.add(molecule);const atomMaterial=new THREE.MeshPhysicalMaterial({color:0x24d9d1,metalness:.04,roughness:.1,transmission:.2,thickness:.7,ior:1.45,clearcoat:1,clearcoatRoughness:.05,emissive:0x073f46,emissiveIntensity:.65});
function makeAtom(pos){const g=new THREE.Group();g.position.copy(pos);g.scale.setScalar(.48);molecule.add(g);const core=new THREE.Mesh(new THREE.SphereGeometry(1,80,80),atomMaterial.clone());g.add(core);const inner=new THREE.Mesh(new THREE.SphereGeometry(.78,56,56),new THREE.MeshBasicMaterial({color:0x6bfff5,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(inner);const shell=new THREE.Mesh(new THREE.SphereGeometry(1.045,56,56),new THREE.MeshBasicMaterial({color:0x5dfff2,transparent:true,opacity:.075,blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false}));g.add(shell);const hi=new THREE.Mesh(new THREE.SphereGeometry(.12,24,24),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.82}));hi.position.set(-.25,.4,.86);g.add(hi);return{g,inner,shell}}
function makeBond(a,b,doubleBond=false){const direction=new THREE.Vector3().subVectors(b,a),length=direction.length(),mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5);const g=new THREE.Group();g.position.copy(mid);g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());molecule.add(g);const outer=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,length*.94,40,1,true),new THREE.MeshPhysicalMaterial({color:0x35eee2,transparent:true,opacity:.22,transmission:.3,roughness:.1,emissive:0x0b6665,emissiveIntensity:.75}));g.add(outer);const core=new THREE.Mesh(new THREE.CylinderGeometry(.036,.036,length*.96,24),new THREE.MeshBasicMaterial({color:0xa4fff9,transparent:true,opacity:.72,blending:THREE.AdditiveBlending}));g.add(core);if(doubleBond){for(const s of[-1,1]){const secondary=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,length*.78,20),new THREE.MeshBasicMaterial({color:0x8ffff8,transparent:true,opacity:.48,blending:THREE.AdditiveBlending}));secondary.position.x=s*.16;g.add(secondary)}}}
const R=1.72,points=[],atoms=[];for(let i=0;i<6;i++){const angle=Math.PI/2+i*Math.PI/3;const p=new THREE.Vector3(Math.cos(angle)*R,Math.sin(angle)*R,0);points.push(p);atoms.push(makeAtom(p))}for(let i=0;i<6;i++)makeBond(points[i],points[(i+1)%6],i%2===0);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.13,.025,16,96),new THREE.MeshBasicMaterial({color:0x5dfff2,transparent:true,opacity:.16,blending:THREE.AdditiveBlending}));molecule.add(ring);
const particles=[];for(let i=0;i<30;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.025,10,10),new THREE.MeshBasicMaterial({color:0x8ffff7,transparent:true,opacity:.65,blending:THREE.AdditiveBlending}));p.userData={phase:Math.random()*Math.PI*2,radius:2.05+Math.random()*.75,speed:.12+Math.random()*.22};scene.add(p);particles.push(p)}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);function animate(t){const time=t*.001;molecule.rotation.y=Math.sin(time*.28)*.24;molecule.rotation.x=Math.sin(time*.18)*.08;key.position.x=2.8+Math.sin(time)*.9;key.position.y=2.8+Math.cos(time*.8)*.5;atoms.forEach((a,i)=>{const pulse=1+Math.sin(time*1.7+i*.7)*.022;a.inner.scale.setScalar(pulse);a.shell.scale.setScalar(1+Math.sin(time*1.7+i*.7)*.015)});particles.forEach((p,i)=>{const q=time*p.userData.speed+p.userData.phase;p.position.set(Math.cos(q)*p.userData.radius,Math.sin(q)*p.userData.radius,Math.sin(q*1.7+i)*.35)});renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
