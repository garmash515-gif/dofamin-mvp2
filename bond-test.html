<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dofamin — 3D Bond Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05091d;color:#fff;font-family:Arial,sans-serif}#stage{width:100%;height:100%;display:block}.label{position:fixed;left:24px;top:24px;z-index:2;letter-spacing:.12em;font-size:12px;color:#67eee3}.note{position:fixed;left:24px;bottom:24px;z-index:2;color:rgba(255,255,255,.55);font-size:12px}</style></head><body><div class="label">DOFAMIN · 3D BOND TEST</div><div class="note">два объёмных атома · светящаяся связь</div><canvas id="stage"></canvas><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
const canvas=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05091d);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,0,6.2);scene.add(new THREE.HemisphereLight(0x8ecfff,0x10051f,1.5));const key=new THREE.PointLight(0x55fff1,38,14,2);key.position.set(2.5,2.5,4);scene.add(key);const rim=new THREE.PointLight(0x744dff,30,12,2);rim.position.set(-2,-1.5,3);scene.add(rim);const group=new THREE.Group();scene.add(group);
function makeAtom(position){const g=new THREE.Group();g.position.copy(position);g.scale.setScalar(.78);group.add(g);const core=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),new THREE.MeshPhysicalMaterial({color:0x29d9d0,metalness:.05,roughness:.09,transmission:.28,thickness:.75,ior:1.45,clearcoat:1,emissive:0x083f46,emissiveIntensity:.7}));g.add(core);const inner=new THREE.Mesh(new THREE.SphereGeometry(.78,64,64),new THREE.MeshBasicMaterial({color:0x67fff4,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(inner);const shell=new THREE.Mesh(new THREE.SphereGeometry(1.045,64,64),new THREE.MeshBasicMaterial({color:0x5dfff2,transparent:true,opacity:.08,blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false}));g.add(shell);const highlight=new THREE.Mesh(new THREE.SphereGeometry(.13,32,32),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.8}));highlight.position.set(-.28,.42,.87);g.add(highlight);return{g,inner,shell}}
const a=makeAtom(new THREE.Vector3(-1.35,0,0)),b=makeAtom(new THREE.Vector3(1.35,0,0));
const start=new THREE.Vector3(-.75,0,0),end=new THREE.Vector3(.75,0,0),direction=new THREE.Vector3().subVectors(end,start),length=direction.length(),mid=new THREE.Vector3().addVectors(start,end).multiplyScalar(.5);const bondGroup=new THREE.Group();bondGroup.position.copy(mid);bondGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());group.add(bondGroup);const outer=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,length*.94,48,1,true),new THREE.MeshPhysicalMaterial({color:0x35eee2,transparent:true,opacity:.2,transmission:.3,roughness:.1,emissive:0x0c6665,emissiveIntensity:.8}));bondGroup.add(outer);const core=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,length*.96,32),new THREE.MeshBasicMaterial({color:0x9ffff8,transparent:true,opacity:.75,blending:THREE.AdditiveBlending}));bondGroup.add(core);
const particles=[];for(let i=0;i<14;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.035,12,12),new THREE.MeshBasicMaterial({color:0x8ffff7,transparent:true,opacity:.65,blending:THREE.AdditiveBlending}));p.userData={phase:Math.random()*Math.PI*2,speed:.35+Math.random()*.5,offset:(Math.random()-.5)*.12};bondGroup.add(p);particles.push(p)}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);function animate(t){const time=t*.001;group.rotation.y=Math.sin(time*.3)*.22;group.rotation.x=Math.sin(time*.2)*.06;key.position.x=2.5+Math.sin(time)*.8;key.position.y=2.5+Math.cos(time*.8)*.5;[a,b].forEach((atom,i)=>{const pulse=1+Math.sin(time*1.7+i)*.025;atom.inner.scale.setScalar(pulse);atom.shell.scale.setScalar(1+Math.sin(time*1.7+i)*.018)});particles.forEach((p,i)=>{const progress=((time*p.userData.speed+p.userData.phase)%(Math.PI*2))/(Math.PI*2);p.position.set(p.userData.offset+Math.sin(time*1.4+i)*.035,(progress-.5)*1.42,Math.cos(time*1.1+i)*.035)});renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
