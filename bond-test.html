<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Dofamin — путь по молекуле</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05091d;color:#fff;font-family:Arial,sans-serif}body{min-height:100dvh}.app{position:relative;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 52%,#0d2440 0%,#070e28 35%,#05091d 72%)}#stage{position:absolute;inset:0;width:100%;height:100%;display:block}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;z-index:3}.brand{font-weight:700;letter-spacing:.04em;font-size:18px}.brand span{display:block;font-size:8px;font-weight:400;letter-spacing:.16em;color:#67eee3;margin-top:3px}.menu{width:40px;height:40px;border:1px solid rgba(103,238,227,.3);border-radius:13px;background:rgba(5,9,29,.38);color:#67eee3;font-size:22px}.intro{position:absolute;z-index:2;left:20px;right:20px;top:86px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.2em;color:#67eee3;margin-bottom:8px}.title{font-size:34px;line-height:.96;font-weight:800;letter-spacing:-.04em;margin:0;max-width:330px}.title em{font-style:normal;background:linear-gradient(90deg,#f7ffff,#67eee3);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{margin:12px 0 0;max-width:330px;font-size:13px;line-height:1.5;color:rgba(235,242,255,.62)}.molecule-wrap{position:absolute;z-index:1;left:50%;top:54%;width:min(86vw,380px);height:min(48vh,390px);transform:translate(-50%,-50%)}.molecule-glow{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(65,220,215,.16),rgba(50,100,220,.06) 42%,transparent 70%);filter:blur(10px)}.path-buttons{position:absolute;inset:0;z-index:4;pointer-events:none}.path{position:absolute;min-width:92px;padding:8px 10px;border:1px solid rgba(130,160,210,.42);border-radius:999px;background:rgba(12,27,55,.76);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#eaf3ff;font-size:9px;line-height:1.15;text-align:center;box-shadow:0 0 18px rgba(70,220,220,.07);pointer-events:auto;transition:.2s}.path b{display:block;font-size:8px;letter-spacing:.1em;color:#7f94b8;margin-bottom:2px}.path.active{border-color:#67eee3;box-shadow:0 0 22px rgba(103,238,227,.24);transform:scale(1.04)}.p1{left:50%;top:1%;transform:translateX(-50%)}.p2{right:0;top:29%}.p3{right:2%;bottom:18%}.p4{left:50%;bottom:0;transform:translateX(-50%)}.p5{left:0;bottom:18%}.p6{left:0;top:29%}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:1px solid rgba(103,238,227,.34);background:rgba(4,13,32,.74);display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 28px rgba(80,220,220,.08);pointer-events:none}.center b{font-size:10px;letter-spacing:.08em}.center span{display:block;font-size:8px;color:#8799b8;margin-top:5px}.bottom{position:absolute;z-index:3;left:20px;right:20px;bottom:max(16px,env(safe-area-inset-bottom));height:50px;display:flex;align-items:center;justify-content:center}.start{width:min(100%,340px);height:46px;border:0;border-radius:16px;background:linear-gradient(100deg,#694cff,#3ddbd0);color:#fff;font-size:14px;font-weight:700;box-shadow:0 10px 35px rgba(68,104,255,.22)}@media(max-height:700px){.intro{top:72px}.title{font-size:29px}.sub{margin-top:8px;font-size:12px}.molecule-wrap{top:56%;height:44vh}.bottom{height:44px}.start{height:40px}}@media(min-width:700px){.molecule-wrap{width:520px;height:520px;top:58%}.intro{left:48px;top:100px}.title{font-size:46px}.path{font-size:11px}.path b{font-size:9px}}
</style></head><body><main class="app"><canvas id="stage"></canvas><header class="top"><div class="brand">DOPAMIN<span>ПУТЬ К ВПЕЧАТЛЕНИЯМ</span></div><button class="menu" aria-label="Меню">☰</button></header><section class="intro"><div class="eyebrow">ДЕЙТИНГ. ВПЕЧАТЛЕНИЕ.</div><h1 class="title">Найди <em>своё</em><br>впечатление</h1><p class="sub">Пройди путь по молекуле дофамина и собери впечатление, которое хочется разделить.</p></section><section class="molecule-wrap"><div class="molecule-glow"></div><div class="path-buttons"><button class="path p1"><b>01</b>Настроение</button><button class="path p2"><b>02</b>Компания</button><button class="path p3"><b>03</b>Риск</button><button class="path p4"><b>04</b>Город</button><button class="path p5"><b>05</b>Сюрприз</button><button class="path p6"><b>06</b>Впечатление</button></div><div class="center"><div><b>ПУТЬ</b><span>к впечатлению</span></div></div></section><footer class="bottom"><button class="start">Начать путь&nbsp;&nbsp; →</button></footer></main>
<script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';const canvas=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);scene.add(new THREE.HemisphereLight(0x9bd8ff,0x10051f,1.5));const key=new THREE.PointLight(0x55fff1,38,16,2),rim=new THREE.PointLight(0x744dff,28,14,2);scene.add(key,rim);const molecule=new THREE.Group();scene.add(molecule);const mat=new THREE.MeshPhysicalMaterial({color:0x24d9d1,metalness:.04,roughness:.1,transmission:.2,thickness:.7,ior:1.45,clearcoat:1,clearcoatRoughness:.05,emissive:0x073f46,emissiveIntensity:.65});function atom(p){const g=new THREE.Group();g.position.copy(p);g.scale.setScalar(.42);molecule.add(g);g.add(new THREE.Mesh(new THREE.SphereGeometry(1,48,48),mat.clone()));const inner=new THREE.Mesh(new THREE.SphereGeometry(.78,32,32),new THREE.MeshBasicMaterial({color:0x6bfff5,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(inner);const shell=new THREE.Mesh(new THREE.SphereGeometry(1.04,32,32),new THREE.MeshBasicMaterial({color:0x5dfff2,transparent:true,opacity:.075,blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false}));g.add(shell);const hi=new THREE.Mesh(new THREE.SphereGeometry(.11,16,16),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.82}));hi.position.set(-.25,.4,.86);g.add(hi);return{g,inner,shell}}function bond(a,b,doubleBond){const d=new THREE.Vector3().subVectors(b,a),l=d.length(),m=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5),g=new THREE.Group();g.position.copy(m);g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());molecule.add(g);g.add(new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,l*.94,24,1,true),new THREE.MeshPhysicalMaterial({color:0x35eee2,transparent:true,opacity:.22,transmission:.3,roughness:.1,emissive:0x0b6665,emissiveIntensity:.75})));g.add(new THREE.Mesh(new THREE.CylinderGeometry(.028,.028,l*.96,16),new THREE.MeshBasicMaterial({color:0xa4fff9,transparent:true,opacity:.72,blending:THREE.AdditiveBlending})));if(doubleBond)for(const s of[-1,1]){const x=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,l*.76,12),new THREE.MeshBasicMaterial({color:0x8ffff8,transparent:true,opacity:.45,blending:THREE.AdditiveBlending}));x.position.x=s*.12;g.add(x)}}const R=1.55,pts=[],atoms=[];for(let i=0;i<6;i++){const a=Math.PI/2+i*Math.PI/3,p=new THREE.Vector3(Math.cos(a)*R,Math.sin(a)*R,0);pts.push(p);atoms.push(atom(p))}for(let i=0;i<6;i++)bond(pts[i],pts[(i+1)%6],i%2===0);const particles=[];for(let i=0;i<16;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.02,8,8),new THREE.MeshBasicMaterial({color:0x8ffff7,transparent:true,opacity:.5,blending:THREE.AdditiveBlending}));p.userData={phase:Math.random()*6.28,r:1.9+Math.random()*.55,s:.1+Math.random()*.18};scene.add(p);particles.push(p)}function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();const mobile=w<600;camera.position.set(0,0,mobile?6.9:6.4);molecule.scale.setScalar(mobile?.72:1)}addEventListener('resize',resize);resize();document.querySelectorAll('.path').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.path').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}));document.querySelector('.start').addEventListener('click',()=>document.querySelector('.p1').click());function animate(t){const time=t*.001;molecule.rotation.y=Math.sin(time*.25)*.2;molecule.rotation.x=Math.sin(time*.18)*.06;key.position.set(2.5+Math.sin(time)*.8,2.4+Math.cos(time*.8)*.5,4);rim.position.set(-2,-1.5,3);atoms.forEach((a,i)=>{const q=1+Math.sin(time*1.6+i*.6)*.018;a.inner.scale.setScalar(q);a.shell.scale.setScalar(1+Math.sin(time*1.6+i*.6)*.012)});particles.forEach((p,i)=>{const q=time*p.userData.s+p.userData.phase;p.position.set(Math.cos(q)*p.userData.r,Math.sin(q)*p.userData.r,Math.sin(q*1.5+i)*.3)});renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);</script></body></html>
