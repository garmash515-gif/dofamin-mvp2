<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070d26">
  <title>Dofamin — путь к впечатлению</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>dofamin</div>
      <span class="tag">ПУТЬ К ВПЕЧАТЛЕНИЮ</span>
    </header>

    <section class="hero">
      <div class="copy">
        <p class="eyebrow">не дейтинг. впечатление.</p>
        <h1>Куда<br><span>сходить?</span></h1>
        <p class="lead">Не выбирай из сотни вариантов. Пройди путь — и найди впечатление, которым захочется поделиться.</p>
        <button id="start">Начать путь <b>→</b></button>
      </div>

      <div class="molecule-stage">
        <div class="molecule-placeholder" aria-label="Молекула дофамина">
          <svg class="dopamine" viewBox="0 0 620 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Объёмная стилизованная молекула дофамина">
            <defs>
              <radialGradient id="carbon" cx="28%" cy="20%">
                <stop offset="0" stop-color="#ffffff"/><stop offset=".12" stop-color="#d8fffb"/>
                <stop offset=".34" stop-color="#48eadc"/><stop offset=".72" stop-color="#5364ff"/><stop offset="1" stop-color="#21104f"/>
              </radialGradient>
              <radialGradient id="oxygen" cx="28%" cy="20%">
                <stop offset="0" stop-color="#ffffff"/><stop offset=".2" stop-color="#ffc5df"/><stop offset=".55" stop-color="#ff668e"/><stop offset="1" stop-color="#6c1e59"/>
              </radialGradient>
              <radialGradient id="nitrogen" cx="28%" cy="20%">
                <stop offset="0" stop-color="#ffffff"/><stop offset=".2" stop-color="#d9fffb"/><stop offset=".55" stop-color="#4ae6dc"/><stop offset="1" stop-color="#2949aa"/>
              </radialGradient>
              <linearGradient id="bond" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#d5fffb"/><stop offset=".35" stop-color="#48eadc"/><stop offset=".72" stop-color="#695dff"/><stop offset="1" stop-color="#b88aff"/>
              </linearGradient>
              <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
              <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#00052a" flood-opacity=".55"/></filter>
            </defs>

            <ellipse cx="300" cy="320" rx="210" ry="210" fill="#42e8dc" opacity=".075" filter="url(#soft)"/>
            <circle cx="300" cy="320" r="174" fill="none" stroke="#48eadc" stroke-opacity=".14" stroke-width="1"/>
            <circle cx="300" cy="320" r="202" fill="none" stroke="#6b55ff" stroke-opacity=".12" stroke-width="1"/>

            <!-- Центральное бензольное кольцо -->
            <g stroke="url(#bond)" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)">
              <path d="M300 195 L408 257 L408 383 L300 445 L192 383 L192 257 Z" stroke-width="15"/>
              <path d="M300 216 L387 266 M387 374 L300 424 M213 374 L213 266" stroke-width="8" opacity=".95"/>
            </g>

            <!-- Боковая цепочка -CH2-CH2-NH2 -->
            <g stroke="url(#bond)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#shadow)">
              <path d="M408 257 L477 217 L527 246"/>
              <path d="M527 246 L555 218"/>
            </g>

            <!-- Две OH-группы -->
            <g stroke="url(#bond)" stroke-width="13" stroke-linecap="round" fill="none" filter="url(#shadow)">
              <path d="M192 257 L139 216"/>
              <path d="M192 383 L139 424"/>
            </g>

            <!-- Шесть углеродных атомов кольца -->
            <g fill="url(#carbon)" stroke="#d2fffa" stroke-opacity=".30" stroke-width="2" filter="url(#glow)">
              <circle cx="300" cy="195" r="34"/><circle cx="408" cy="257" r="34"/><circle cx="408" cy="383" r="34"/>
              <circle cx="300" cy="445" r="34"/><circle cx="192" cy="383" r="34"/><circle cx="192" cy="257" r="34"/>
            </g>

            <!-- Кислород -->
            <g fill="url(#oxygen)" stroke="#ffd8e8" stroke-opacity=".48" stroke-width="2" filter="url(#glow)">
              <circle cx="113" cy="196" r="31"/><circle cx="113" cy="444" r="31"/>
            </g>
            <g fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="800" text-anchor="middle"><text x="113" y="201">OH</text><text x="113" y="449">OH</text></g>

            <!-- Два углерода цепочки + азот -->
            <g fill="url(#carbon)" stroke="#d2fffa" stroke-opacity=".30" stroke-width="2" filter="url(#glow)"><circle cx="477" cy="217" r="32"/><circle cx="527" cy="246" r="32"/></g>
            <g fill="url(#nitrogen)" stroke="#d8fffb" stroke-opacity=".55" stroke-width="2" filter="url(#glow)"><circle cx="555" cy="218" r="34"/></g>
            <text x="555" y="223" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="800" text-anchor="middle">NH₂</text>

            <!-- Блики создают ощущение объёма -->
            <g fill="#fff" opacity=".88"><circle cx="289" cy="183" r="5"/><circle cx="397" cy="245" r="5"/><circle cx="125" cy="185" r="4"/><circle cx="467" cy="206" r="4"/><circle cx="545" cy="207" r="4"/></g>
          </svg>
        </div>
      </div>
    </section>

    <footer>Концепт интерфейса · первый экран</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
